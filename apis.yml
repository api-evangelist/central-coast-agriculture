aid: central-coast-agriculture
name: Central Coast Agriculture
description: 'Central Coast Agriculture, Inc. (CCA) is a vertically integrated California
  cannabis cultivator and manufacturer headquartered in the Santa Ynez Valley north
  of Santa Barbara, best known for its Raw Garden brand of fresh-frozen concentrates,
  vapes and infused pre-rolls. The company describes itself as a progressive farm
  focused on utilizing science and sustainability to grow quality, modern crops, and
  operates its own farming, genetics/breeding and extraction programs. It is a physical
  agricultural and consumer-packaged-goods business: it publishes a corporate site,
  a consumer brand site and a wholesale ordering page, but no public API, developer
  portal, SDK or machine-readable specification of any kind.'
